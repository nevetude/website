[project]
name = "music-backend"
version = "0.1.0"
description = "API and Genius importer of the Music app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]  # ruff format owns line length; long comments and strings are fine
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "ASYNC", "S", "PERF", "TC",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr.directive"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "TC"]  # asserts, dummy password hashes, runtime-typed fixtures
"tests/test_names.py" = ["RUF001"]  # Genius uses the typographic apostrophe
"migrations/**" = ["TC"]  # generated code
# SQLAlchemy evaluates these annotations at runtime, so they must not move under TYPE_CHECKING
"src/music_backend/models/**" = ["TC"]
# FastAPI resolves route annotations at runtime too
"src/music_backend/api/**" = ["TC"]
"src/music_backend/main.py" = ["TC"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=music_backend --cov-report=term-missing"

[tool.fastapi]
entrypoint = "music_backend.main:app"
